name: Build and Release
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp colorama pyinstaller
      - name: Build EXE
        run: |
          pyinstaller --onefile --name guns.lol-user main.py
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: guns.lol Checker
          files: dist/guns.lol-user.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
